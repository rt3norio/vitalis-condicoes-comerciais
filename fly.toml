# Fly.io: implantado em 22/10/2026 em https://vitalis-condicoes.fly.dev (app vitalis-condicoes, volume dados, região gru).
# Para recriar do zero:
#   fly apps create <nome>          (e troque `app` abaixo)
#   fly volumes create dados --region gru --size 1
#   fly secrets set OPENROUTER_API_KEY=...
app = "vitalis-condicoes"
primary_region = "gru"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/app.db"
  ERP_BASE_URL = "http://127.0.0.1:3000"
  MODEL_EXTRATOR = "z-ai/glm-5.3"
  MODEL_VERIFICADOR = "z-ai/glm-5.3"
  MODEL_REDATOR = "z-ai/glm-5.3"

[[mounts]]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # máquina sempre ligada: o agendador roda dentro dela (S20)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
